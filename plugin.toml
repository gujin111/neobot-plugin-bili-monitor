name = "bili_monitor"
version = "1.1.0"
description = "B 站 UP 主动态 / 开播 / 粉丝里程碑监控（移植自 bili 监控助手 1.7.20）"
author = "bili_monitor contributors"
license = "MIT"
tags = ["bilibili", "monitor", "notification"]
repo = "https://github.com/gujin111/neobot-plugin-bili-monitor"
branch = "main"
homepage = "https://github.com/gujin111/neobot-plugin-bili-monitor#readme"
python_dependencies = [
    "httpx>=0.27,<0.29",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<0.23",
    "pydantic>=2,<3",
]
hot_reload = true
config_hot_reload = false
min_neobot_version = "2.1.0"

[config]
# 命令前缀；群聊里仍需 @机器人
command_prefix = "/"
# B 站登录 Cookie（可选）：SESSDATA=...; bili_jct=...
cookie = ""
# 动态轮询间隔（秒）
dynamic_interval_seconds = 120
# 直播轮询间隔（秒）
live_interval_seconds = 90
# 发送模式：auto / text / image / card
send_mode = "auto"
# 提醒里附带原文链接
include_link = true
# 同时监控的 UP 主上限
max_subscriptions = 30
# 文案模板：留空用内置文案；占位符见 /b站管理 tpl <uid> <类别> ?
template_dynamic_new = ""
template_dynamic_repost = ""
template_dynamic_video = ""
template_dynamic_article = ""
template_dynamic_audio = ""
template_live_on = ""
template_live_off = ""
template_follower = ""

[sdk]
version = 1
contract = "plugin.contract.json"
